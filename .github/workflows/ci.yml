name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # the browser smoke is the only check that Excalidraw's font worker loads
      - run: pnpm --filter @wiredown/web exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm --filter @wiredown/web smoke
